<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ───────────────────────────────────────────────────── -->
    <title>VenCraft - Build Fast. Pitch Perfect. Fund Faster.</title>
    <meta name="description" content="VenCraft helps startup founders go from idea to funded in record time. We co-build your MVP, craft investor-ready pitch decks, and connect you directly to our network of 200+ active seed investors." />
    <meta name="keywords" content="VenCraft, startup funding, MVP development, pitch deck, seed investors, startup accelerator, startup studio, fundraising, venture capital, pitch perfect, build MVP fast, investor network, startup Africa, Nigeria startup" />
    <meta name="author" content="VenCraft" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://vencraft.io" />

    <!-- ── Favicons ───────────────────────────────────────────────────────── -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/vencraft-logo.svg" />
    <meta name="theme-color" content="#99ea48" />
    <meta name="msapplication-TileColor" content="#010205" />

    <!-- ── Open Graph (Facebook / LinkedIn / WhatsApp) ───────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VenCraft" />
    <meta property="og:title" content="VenCraft — Build Fast. Pitch Perfect. Fund Faster." />
    <meta property="og:description" content="From idea to funded startup in one sprint. VenCraft co-builds your MVP, creates your pitch assets, and introduces you to 200+ active investors." />
    <meta property="og:url" content="https://vencraft.io" />
    <meta property="og:image" content="https://vencraft.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VenCraft — startup accelerator that builds MVPs and connects founders to investors" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ──────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vencraft_io" />
    <meta name="twitter:creator" content="@vencraft_io" />
    <meta name="twitter:title" content="VenCraft — Build Fast. Pitch Perfect. Fund Faster." />
    <meta name="twitter:description" content="From idea to funded startup in one sprint. MVP, pitch deck, and investor introductions — all in one place." />
    <meta name="twitter:image" content="https://vencraft.io/og-image.png" />
    <meta name="twitter:image:alt" content="VenCraft startup accelerator" />

    <!-- ── Structured Data — Organisation ────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "VenCraft",
      "url": "https://vencraft.io",
      "logo": "https://vencraft.io/vencraft-logo.svg",
      "description": "VenCraft is the fastest path from idea to funded startup. We co-build your MVP and pitch assets in parallel, then connect you directly to our network of 200+ active seed investors.",
      "email": "vencraft.io@gmail.com",
      "telephone": "+2347046346780",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Worldwide"
      },
      "sameAs": [
        "https://x.com/vencraft_io",
        "https://www.instagram.com/vencraft.io/",
        "https://www.tiktok.com/@vencraft.io",
        "https://www.facebook.com/profile.php?id=61594411436008"
      ],
      "foundingDate": "2024",
      "areaServed": "Worldwide",
      "serviceType": ["Startup Accelerator", "MVP Development", "Pitch Deck Design", "Investor Network", "Startup Studio"]
    }
    </script>

    <!-- ── Structured Data — WebSite (enables Google Sitelinks search box) ─ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "VenCraft",
      "url": "https://vencraft.io",
      "description": "Build Fast. Pitch Perfect. Fund Faster.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://vencraft.io/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── Structured Data — Service ─────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "VenCraft Startup Acceleration",
      "provider": {
        "@type": "Organization",
        "name": "VenCraft"
      },
      "description": "End-to-end startup acceleration: rapid MVP development, investor-ready pitch deck creation, and direct warm introductions to a curated network of 200+ active seed and pre-seed investors.",
      "serviceType": "Startup Accelerator",
      "areaServed": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "VenCraft Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "MVP Development",
              "description": "Rapid co-building of your Minimum Viable Product with experienced engineers and designers."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Pitch Deck Design",
              "description": "Investor-ready pitch decks crafted by storytellers who know what partners want to see."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Investor Network Access",
              "description": "Warm introductions to 200+ active seed and pre-seed investors worldwide."
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
